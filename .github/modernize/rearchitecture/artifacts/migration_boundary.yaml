user_intent:
  raw_request: "Review the whole project and clean it up by reusing as much code and components as possible."
  inferred_acceptance:
    - "identify safe duplication and reusable modules across frontend and backend"
    - "preserve existing routes, API contracts, authorization, audit and database history"
    - "do not remove behavior merely because files look similar"
  cleanup_required: true
strategy: phased
runtime_reachable:
  - frontend/src/app/app.routes.ts
  - frontend/src/app/features
  - backend/src/main/java/br/edu/ifgoiano/sager
  - backend/src/main/resources/db/migration
must_rewrite: []
copy_as_is:
  - frontend/src/app/shared/review-dialog.component.ts
  - frontend/src/app/features/operations/operations-local.utils.ts
  - backend/src/main/java/br/edu/ifgoiano/sager/audit/AuditService.java
legacy_allowed_to_remain:
  - backend/src/main/resources/db/migration/V1__identity_and_profiles.sql
  - backend/src/main/resources/db/migration/V11__management_audit.sql
  - backend/src/main/resources/db/migration/V12__local_account_links.sql
defer_cleanup:
  - "Extract shared frontend state and date helpers after adding focused tests."
  - "Consolidate actor and JDBC primitive helpers without changing exception contracts."
  - "Split IntegrationTransactions only after integration worker tests pass."
  - "Review unused sager_identity tables with production evidence before adding a drop migration."
  - "Do not rewrite Flyway files that may already be applied."
full_rewrite_reason: null
implementation_rule: >
  Cleanup is phased. First extract mechanically identical helpers and add regression
  tests; then remove duplicate call sites. Domain tables, histories, snapshots,
  API routes and authorization policies are not cleanup targets without explicit
  behavior-preserving migrations.

