spring:
  application:
    name: sager-backend
  datasource:
    url: ${SAGER_DB_URL:jdbc:postgresql://localhost:5432/sager}
    username: ${SAGER_DB_USER:sager}
    password: ${SAGER_DB_PASSWORD}
  flyway:
    enabled: true
  session:
    timeout: ${SAGER_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
springdoc:
  api-docs:
    enabled: false
logging:
  structured:
    format:
      console: logstash
