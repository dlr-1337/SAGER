server:
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
spring:
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 8
      connection-timeout: 3000
      connection-init-sql: SET statement_timeout = '15s'; SET idle_in_transaction_session_timeout = '30s'
springdoc:
  api-docs:
    enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
sager:
  production:
    public-host: ${SAGER_PUBLIC_HOST}
    rate-limit-secret: ${SAGER_RATE_LIMIT_SECRET}
  documents:
    private-root: ${SAGER_DOCUMENTS_PRIVATE_ROOT:/data/documents}
  reports:
    private-root: ${SAGER_REPORTS_PRIVATE_ROOT:/data/reports}
  integrations:
    whatsapp:
      api-key: ${SAGER_INTEGRATIONS_WHATSAPP_API_KEY:}
      webhook-secret: ${SAGER_INTEGRATIONS_WHATSAPP_WEBHOOK_SECRET:}
