# Docker Compose application, in Raw mode, on the existing Coolify Traefik network.
name: ${SAGER_STACK_NAME:-sager-homologacao}
services:
  database:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_DB: sager
      POSTGRES_USER: sager_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets: [db_owner_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [data]
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.applicationId=${SAGER_COOLIFY_APPLICATION_ID:?Set the existing Coolify application ID}
      - coolify.name=${SAGER_STACK_NAME:-sager-homologacao}-database
      - coolify.resourceName=${SAGER_STACK_NAME:-sager-homologacao}
      - coolify.serviceName=database
      - coolify.pullRequestId=0
      - traefik.enable=false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sager_owner -d sager"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 0.25
    shm_size: 128m
    logging: &safe_logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  migrate:
    build: { context: ., dockerfile: infra/production/backend.Dockerfile }
    image: ${SAGER_BACKEND_IMAGE:-sager-homologacao-backend:current}
    profiles: [maintenance]
    command: [--sager-migrate]
    user: "10001:10001"
    environment:
      SPRING_PROFILES_ACTIVE: migration
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SAGER_DB_URL: jdbc:postgresql://database:5432/sager
      SAGER_DB_USER: sager_owner
    secrets:
      - source: db_owner_password
        target: SAGER_DB_PASSWORD
    depends_on:
      database: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    logging: *safe_logging

  initialize-runtime:
    build: { context: ., dockerfile: infra/coolify/initializer.Dockerfile }
    image: ${SAGER_INITIALIZER_IMAGE:-sager-homologacao-initializer:current}
    profiles: [maintenance]
    user: "10001:10001"
    secrets: [db_owner_password, db_runtime_password]
    depends_on:
      database: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging: *safe_logging

  backend:
    build: { context: ., dockerfile: infra/production/backend.Dockerfile }
    image: ${SAGER_BACKEND_IMAGE:-sager-homologacao-backend:current}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SAGER_DB_URL: jdbc:postgresql://database:5432/sager
      SAGER_DB_USER: sager_runtime
      SAGER_PUBLIC_HOST: ${SAGER_PUBLIC_HOST:?Set the public DNS hostname}
      SAGER_DOCUMENTS_PRIVATE_ROOT: /data/documents
      SAGER_REPORTS_PRIVATE_ROOT: /data/reports
      SAGER_INTEGRATIONS_WHATSAPP_ENABLED: ${SAGER_INTEGRATIONS_WHATSAPP_ENABLED:-false}
      SAGER_INTEGRATIONS_WHATSAPP_BASE_URL: http://whatsapp-gateway-proxy:3000
    secrets:
      - source: db_runtime_password
        target: SAGER_DB_PASSWORD
      - source: login_rate_secret
        target: SAGER_RATE_LIMIT_SECRET
      - source: waha_api_key
        target: SAGER_INTEGRATIONS_WHATSAPP_API_KEY
      - source: waha_webhook_hmac
        target: SAGER_INTEGRATIONS_WHATSAPP_WEBHOOK_SECRET
    volumes:
      - documents:/data/documents
      - reports:/data/reports
    depends_on:
      database: { condition: service_healthy }
    networks: [data, gateway, outbound, whatsapp_api]
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.applicationId=${SAGER_COOLIFY_APPLICATION_ID:?Set the existing Coolify application ID}
      - coolify.name=${SAGER_STACK_NAME:-sager-homologacao}-backend
      - coolify.resourceName=${SAGER_STACK_NAME:-sager-homologacao}
      - coolify.serviceName=backend
      - coolify.pullRequestId=0
      - traefik.enable=false
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: 0.65
    healthcheck:
      test:
        [
          CMD,
          bash,
          -c,
          'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q "^HTTP/1.1 200"',
        ]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *safe_logging

  gateway:
    build:
      context: .
      dockerfile: infra/production/gateway.Dockerfile
      target: coolify
    image: ${SAGER_GATEWAY_IMAGE:-sager-homologacao-gateway:current}
    restart: unless-stopped
    environment:
      SAGER_PUBLIC_HOST: ${SAGER_PUBLIC_HOST:?Set the public DNS hostname}
    depends_on:
      backend: { condition: service_healthy }
    networks: [gateway, coolify]
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.applicationId=${SAGER_COOLIFY_APPLICATION_ID:?Set the existing Coolify application ID}
      - coolify.name=${SAGER_STACK_NAME:-sager-homologacao}-gateway
      - coolify.resourceName=${SAGER_STACK_NAME:-sager-homologacao}
      - coolify.serviceName=gateway
      - coolify.pullRequestId=0
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-http.rule=Host(`${SAGER_PUBLIC_HOST:?Set the public DNS hostname}`)
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-http.entrypoints=http
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-http.middlewares=${SAGER_STACK_NAME:-sager-homologacao}-https-redirect
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-http.service=${SAGER_STACK_NAME:-sager-homologacao}-gateway
      - traefik.http.middlewares.${SAGER_STACK_NAME:-sager-homologacao}-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${SAGER_STACK_NAME:-sager-homologacao}-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-https.rule=Host(`${SAGER_PUBLIC_HOST:?Set the public DNS hostname}`)
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-https.entrypoints=https
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-https.tls=true
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-https.tls.certresolver=letsencrypt
      - traefik.http.routers.${SAGER_STACK_NAME:-sager-homologacao}-https.service=${SAGER_STACK_NAME:-sager-homologacao}-gateway
      - traefik.http.services.${SAGER_STACK_NAME:-sager-homologacao}-gateway.loadbalancer.server.port=8080
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.10
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/readiness]
      start_period: 10s
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *safe_logging

  whatsapp-gateway-prepare:
    image: devlikeapro/waha:gows-2026.10.1@sha256:1f7faeb0227ad5edb5711f7058bfce807ea65e5f92234af0778e4db140f6eb46
    profiles: [whatsapp]
    user: "0:0"
    entrypoint: [sh, -c, 'chown 10001:10001 /app/.sessions /app/.media && chmod 700 /app/.sessions /app/.media']
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *safe_logging

  whatsapp-gateway:
    image: devlikeapro/waha:gows-2026.10.1@sha256:1f7faeb0227ad5edb5711f7058bfce807ea65e5f92234af0778e4db140f6eb46
    profiles: [whatsapp]
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: [sh, -c, 'set -e; WAHA_API_KEY="$$(cat /run/secrets/waha_api_key)"; WHATSAPP_HOOK_HMAC_KEY="$$(cat /run/secrets/waha_webhook_hmac)"; export WAHA_API_KEY WHATSAPP_HOOK_HMAC_KEY; exec /usr/bin/tini -- /entrypoint.sh']
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "86400"
      WHATSAPP_HOOK_URL: http://whatsapp-gateway-proxy:8080/api/v1/integracoes/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,session.status
      # Covers the backup and deployment windows: 15 tries, 60 s apart.
      WHATSAPP_HOOK_RETRIES_POLICY: constant
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "60"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "15"
    secrets: [waha_api_key, waha_webhook_hmac]
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    depends_on:
      whatsapp-gateway-prepare: { condition: service_completed_successfully }
    networks: [whatsapp_private, whatsapp_egress]
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.applicationId=${SAGER_COOLIFY_APPLICATION_ID:?Set the existing Coolify application ID}
      - coolify.name=${SAGER_STACK_NAME:-sager-homologacao}-whatsapp-gateway
      - coolify.resourceName=${SAGER_STACK_NAME:-sager-homologacao}
      - coolify.serviceName=whatsapp-gateway
      - coolify.pullRequestId=0
      - traefik.enable=false
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    cpu_shares: 256
    oom_score_adj: 500
    pids_limit: 256
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/ping]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *safe_logging

  whatsapp-gateway-proxy:
    image: ${SAGER_GATEWAY_IMAGE:-sager-homologacao-gateway:current}
    profiles: [whatsapp]
    restart: unless-stopped
    entrypoint: [sh, -c, "envsubst '$$SAGER_PUBLIC_HOST $$SAGER_WEBHOOK_UPSTREAM' < /etc/nginx/whatsapp-gateway-proxy.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"]
    environment:
      SAGER_PUBLIC_HOST: ${SAGER_PUBLIC_HOST:?Set the public DNS hostname}
      SAGER_WEBHOOK_UPSTREAM: backend:8080
    networks: [whatsapp_api, whatsapp_private]
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.applicationId=${SAGER_COOLIFY_APPLICATION_ID:?Set the existing Coolify application ID}
      - coolify.name=${SAGER_STACK_NAME:-sager-homologacao}-whatsapp-gateway-proxy
      - coolify.resourceName=${SAGER_STACK_NAME:-sager-homologacao}
      - coolify.serviceName=whatsapp-gateway-proxy
      - coolify.pullRequestId=0
      - traefik.enable=false
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    cpus: 0.10
    logging: *safe_logging

  archive-files:
    image: ${SAGER_BACKEND_IMAGE:-sager-homologacao-backend:current}
    profiles: [maintenance]
    user: "10001:10001"
    entrypoint: [tar]
    volumes: [documents:/data/documents]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging: *safe_logging

networks:
  data: { internal: true }
  gateway: { internal: true }
  outbound: {}
  coolify: { external: true, name: coolify }
  whatsapp_api: { internal: true }
  whatsapp_private: { internal: true }
  # Fixed so the host firewall can block this subnet from private ranges and the public IP.
  whatsapp_egress:
    ipam:
      config:
        - subnet: 10.250.77.0/24
volumes:
  database: {}
  documents: {}
  reports: {}
  waha_sessions: {}
  waha_media: {}
secrets:
  db_owner_password:
    file: ${SAGER_SECRETS_DIR:?Set an absolute external secrets directory}/db_owner_password
  db_runtime_password:
    file: ${SAGER_SECRETS_DIR:?Set an absolute external secrets directory}/db_runtime_password
  login_rate_secret:
    file: ${SAGER_SECRETS_DIR:?Set an absolute external secrets directory}/login_rate_secret
  waha_api_key:
    file: ${SAGER_SECRETS_DIR:?Set an absolute external secrets directory}/waha_api_key
  waha_webhook_hmac:
    file: ${SAGER_SECRETS_DIR:?Set an absolute external secrets directory}/waha_webhook_hmac
